<title>Which Type of Procrastinator Are You?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one centered 560px column on plain white; text inside stays left-aligned. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6b6b6b;
  --line: #c9ccd8;
  --accent: #3544E5;
  --accent-fg: #ffffff;
  --track: #e6e8f5;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
.wrap { max-width: 760px; margin: 0 auto; }
.wrap > section:not(.start) { max-width: 730px; margin: 0 auto; }
h1, h2 { font-family: var(--font); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 14px 32px; font-weight: 600; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { background: #f4f5fa; filter: none; }

/* Start */
.start { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; text-align: center; }
.start h1 { font-size: clamp(30px, 7vw, 44px); }

/* Question */
.counter { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-bottom: 48px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.25s ease; }
.question { font-size: clamp(20px, 4.5vw, 26px); font-weight: 600; line-height: 1.3; text-wrap: wrap; margin: 0 0 24px; min-height: 4em; }
.scale { display: flex; justify-content: space-between; max-width: 450px; margin: 0 auto; }
.scale button { width: 50px; height: 50px; flex: none; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); font-weight: 600; font-size: 18px; transition: background 0.12s, border-color 0.12s; }
.scale button:hover { border-color: var(--accent); }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.scale-labels { display: grid; grid-template-columns: 1fr auto 1fr; max-width: 450px; margin: 12px auto 0; font-size: 13px; color: var(--muted); }
.scale-labels span:first-child { text-align: left; }
.scale-labels span:nth-child(2) { text-align: center; }
.scale-labels span:last-child { text-align: right; }
.nav { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; min-height: 48px; }
/* Result */
.result { display: flex; flex-direction: column; align-items: stretch; gap: 28px; }
.result h1 { font-size: clamp(32px, 8vw, 46px); text-align: center; }
.result-img { align-self: center; max-width: 100%; }
.result-img img { display: block; max-width: 100%; height: 300px; width: auto; object-fit: contain; margin: 0 auto; }
.result-img .ph { width: min(100%, 360px); aspect-ratio: 16 / 9; background: var(--track); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; }
.desc { margin: 0; text-align: left; white-space: pre-line; }
.scores { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.row-head span:first-child { font-weight: 500; }
.row-head span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.track { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; width: 0; transition: width 0.7s cubic-bezier(.2,.7,.2,1); }
@media (prefers-reduced-motion: reduce) { .track > i, .bar > i { transition: none; } }
</style>

};

/* 24 questions, 4 per type. t = result key. */
const QUESTIONS = [
  { t: "perfectionist", q: "I put off starting a task until I feel confident I can do it perfectly." },
  { t: "dreamer", q: "I spend more time imagining the finished result than planning the steps needed to achieve it." },
  { t: "worrier", q: "I delay starting tasks because I'm afraid I won't do them well enough." },
  { t: "defier", q: "I put off tasks when I feel someone is trying to control how I spend my time." },
  { t: "crisis", q: "I wait until a deadline is close before starting because the pressure helps me get moving." },
  { t: "overdoer", q: "I take on so many responsibilities that important tasks get pushed aside." },
  { t: "perfectionist", q: "I spend so much time refining details that I struggle to finish my work." },
  { t: "dreamer", q: "I assume I'll somehow find a way to finish things later, even when I don't have a concrete plan." },
  { t: "worrier", q: "I put off making decisions because I worry I'll regret the choice I make." },
  { t: "defier", q: "I delay doing things because I resent being told that I have to do them." },
  { t: "crisis", q: "I leave tasks until the last minute because I feel more motivated when I'm in a rush." },
  { t: "overdoer", q: "I prioritize helping other people even when my own tasks remain unfinished." },
  { t: "perfectionist", q: "I delay submitting work because I worry it still isn't good enough." },
  { t: "dreamer", q: "I get excited about big ideas but struggle to turn them into realistic, actionable plans." },
  { t: "worrier", q: "I avoid getting started when I'm uncertain about how things will turn out." },
  { t: "defier", q: "When a task feels imposed on me, I resist starting it even when I know it's important." },
  { t: "crisis", q: "I delay getting started until a task feels urgent enough to demand my attention." },
  { t: "overdoer", q: "My schedule is so full of commitments that I end up postponing tasks I intended to complete." },
  { t: "perfectionist", q: "The fear of making even a small mistake makes it difficult for me to get started." },
  { t: "dreamer", q: "I take on ambitious projects without breaking them down into manageable steps, which makes it hard to get started." },
  { t: "worrier", q: "I spend so much time worrying about what could go wrong that I postpone taking action." },
  { t: "defier", q: "I put off obligations because I want to decide for myself when I'll get around to them." },
  { t: "crisis", q: "I underestimate how long tasks will take and end up relying on last-minute effort to finish them." },
  { t: "overdoer", q: "I agree to take on additional tasks even when I already have more work than I can manage." }
];

const MAX_PER_TYPE = 20; // 4 questions x 5 points = 100%
const KEYS = Object.keys(RESULTS);
const app = document.getElementById("app");
let answers = new Array(QUESTIONS.length).fill(null);
let current = 0;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderStart() {
  app.innerHTML = `
    <section class="start">
      <h1>Which Type of Procrastinator Are You?</h1>
      <button class="btn" id="start">Take Quiz</button>
    </section>`;
  document.getElementById("start").onclick = () => { current = 0; renderQuestion(); };
}

function renderQuestion() {
  const n = QUESTIONS.length;
  const sel = answers[current];
  const label = v => v === 1 ? ", Disagree" : v === 3 ? ", Neutral" : v === 5 ? ", Agree" : "";
  app.innerHTML = `
    <section>
      <div class="counter">${current + 1} of ${n}</div>
      <div class="bar"><i style="width:${(current / n) * 100}%"></i></div>
      <p class="question" id="q">${esc(QUESTIONS[current].q)}</p>
      <div class="scale" role="group" aria-labelledby="q">
        ${[1, 2, 3, 4, 5].map(v => `<button type="button" data-v="${v}" aria-pressed="${sel === v}" aria-label="${v}${label(v)}">${v}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>Disagree</span><span>Neutral</span><span>Agree</span></div>
      <div class="nav">
        ${current > 0 ? `<button class="btn ghost" id="back">Back</button>` : `<span></span>`}
        ${sel === null ? "" : current === n - 1
          ? `<button class="btn" id="finish">See my result</button>`
          : `<button class="btn" id="next">Next</button>`}
      </div>
    </section>`;
  app.querySelectorAll(".scale button").forEach(b => b.onclick = () => answer(+b.dataset.v));
  const back = document.getElementById("back");
  if (back) back.onclick = () => { current--; renderQuestion(); };
  const next = document.getElementById("next");
  if (next) next.onclick = () => { current++; renderQuestion(); };
  const fin = document.getElementById("finish");
  if (fin) fin.onclick = renderResult;
}

function answer(v) {
  answers[current] = v;
  renderQuestion();
}

function scores() {
  const s = Object.fromEntries(KEYS.map(k => [k, 0]));
  QUESTIONS.forEach((q, i) => { s[q.t] += answers[i] || 0; });
  return s;
}

function renderResult() {
  const s = scores();
  const order = [...KEYS].sort((a, b) => s[b] - s[a]); // stable: ties keep the list order
  const top = RESULTS[order[0]];
  const img = top.image
    ? `<img src="${esc(top.image)}" alt="${esc(top.name)}">`
    : `<div class="ph" aria-hidden="true">${esc(top.name.replace("The ", "").charAt(0))}</div>`;
  app.innerHTML = `
    <section class="result">
      <h1>${esc(top.name)}</h1>
      <div class="result-img">${img}</div>
      <p class="desc">${esc(top.desc)}</p>
      <div class="scores">
        ${order.map(k => {
          const pct = Math.round((s[k] / MAX_PER_TYPE) * 100);
          return `<div>
            <div class="row-head"><span>${esc(RESULTS[k].name)}</span><span>${pct}%</span></div>
            <div class="track"><i data-w="${pct}"></i></div>
          </div>`;
        }).join("")}
      </div>
    </section>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    app.querySelectorAll(".track > i").forEach(el => el.style.width = el.dataset.w + "%");
  }));
  window.scrollTo(0, 0);
}

renderStart();
</script>
